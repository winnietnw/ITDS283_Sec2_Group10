name: Build iOS

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [ main ]
    paths:
      - 'vibecheck_app/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.6'
        channel: 'stable'

    - name: Install dependencies
      working-directory: vibecheck_app
      run: flutter pub get

    - name: Build iOS device app
      working-directory: vibecheck_app
      run: |
        flutter build ios --release --no-codesign
        cd build/ios/iphoneos
        zip -r Runner.app.zip Runner.app

    - name: Build iOS simulator app
      working-directory: vibecheck_app
      run: |
        flutter build ios --simulator
        cd build/ios/iphonesimulator
        zip -r RunnerSimulator.app.zip Runner.app

    - name: Upload iOS build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: |
          vibecheck_app/build/ios/iphoneos/Runner.app.zip
          vibecheck_app/build/ios/iphonesimulator/RunnerSimulator.app.zip
        retention-days: 30