name: vibecheck_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3


dependencies:
  flutter:
    sdk: flutter

  # Firebase (database + auth)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.4.10
  
  # Navigation
  go_router: ^14.3.0
  
  # State Management
  provider: ^6.1.2
  
  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  
  # Local notifications (reminder)
  flutter_local_notifications: ^17.2.3
  
  # Shared Preferences
  shared_preferences: ^2.3.2

  http: ^1.2.1
  geolocator: ^12.0.0

  cupertino_icons: ^1.0.8

  device_info_plus: ^11.0.0
  intl: ^0.19.0
  network_info_plus: ^5.0.3

  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
